<header class="sticky top-0 z-50 w-full bg-neutral/85 py-3 text-sm font-semibold text-neutral-900 backdrop-blur dark:bg-neutral-800/85 dark:text-neutral print:hidden">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 sm:px-14 md:px-24 lg:px-32">
    <div class="flex flex-row items-center">
      {{ partial "logo.html" . }}
    </div>
    <div class="nav-links">
      <a href="/#about" class="decoration-primary-500 hover:underline hover:decoration-2 hover:underline-offset-2">About</a>
      <a href="/#projects" class="decoration-primary-500 hover:underline hover:decoration-2 hover:underline-offset-2">Projects</a>
      <a href="/#contact" class="decoration-primary-500 hover:underline hover:decoration-2 hover:underline-offset-2">Contact</a>
      <a
        href="/resume.pdf"
        target="_blank"
        rel="noopener noreferrer"
        class="resume-btn"
      >Resume</a>
    </div>
  </nav>
</header>

<script>
  (function(){
    var el = document.getElementById('nav-title');
    if (!el) return;
    var hero = document.querySelector('.hero-top');
    var threshold = hero ? Math.max(hero.offsetHeight * 0.25, 80) : 120;
    var shown = false;

    function check() {
      var should = window.scrollY > threshold;
      if (should === shown) return;
      shown = should;
      el.animate(
        [{ opacity: should ? '0' : '1' }, { opacity: should ? '1' : '0' }],
        { duration: 350, easing: 'ease', fill: 'forwards' }
      );
    }
    check();
    window.addEventListener('scroll', check, { passive: true });
  })();
</script>
